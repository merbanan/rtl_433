# Holtek HT12E (and HT12A) encoder remotes
#
# The HT12E is a 2^12 encoder with 8 address pins (A0-A7) and 4 data pins (D8-D11). The data pins
# are usually the buttons, pulled high, a pressed button is 0.
#
# 433.92 MHz. PWM coded with a base time (TE) that depends on the oscillator resistor, about
# 200 us: each bit is a gap followed by a pulse, a 1 bit is a 2 TE gap and a 1 TE pulse, a 0 bit is
# a 1 TE gap and a 2 TE pulse. A message starts with a 1 TE start pulse after a gap of about 35 TE
# and is repeated. This covers TE from about 180 to 250 us. Slower remotes (TE above about 280 us)
# send each message as a package of its own and are not decoded here, e.g. Harbor Breeze FAN-11T
# (see conf/fan-11t.conf).
#
#     1 AAAAAAAA DDDD
#
# - 1: start pulse, always 1
# - A: 8 bit address (id)
# - D: 4 bit data (button)
#
# There is no integrity check, at least two identical messages are required. The start pulse and
# the all zero code are not checked (a match pattern would select a partial row of a real remote).
#
# Protocol from the Flipper Zero firmware, lib/subghz/protocols/holtek_ht12x.c.
#
# Usage: rtl_433 -c conf/Holtek-HT12E.conf

decoder {
    name=Holtek-HT12E,
    modulation=OOK_PWM,
    short=200,
    long=400,
    gap=1500,
    reset=20000,
    bits=13,
    repeats>=2,
    get=id:@1:{8}:%02x,
    get=button:@9:{4}:%x,
    unique
}
