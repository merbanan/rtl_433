# Nice FLO fixed code gate remotes, e.g. Nice FLO2, FLO4
#
# The Nice FloR-S rolling code remotes are decoded by the built-in Nice-FlorS decoder.
#
# 433.92 MHz, PWM coded with a base time (TE) of 700 us: each bit is a gap followed by a pulse,
# a 1 bit is a 1400 us gap and a 700 us pulse, a 0 bit is a 700 us gap and a 1400 us pulse.
# A message starts with a 700 us start pulse after a 25 ms gap and is repeated.
# 12 bit (DIP switch) and 24 bit codes. There is no integrity check.
#
# Each message is a package of its own (the gap between messages ends the package), so one row:
# the start pulse (always 1) and the code. All zero and all one codes are not rejected.
#
# Usage: rtl_433 -c conf/Nice-FLO.conf

decoder {
    name=Nice-FLO,
    modulation=OOK_PWM,
    short=700,
    long=1400,
    gap=3000,
    reset=30000,
    tolerance=150,
    rows=1,
    match={1}8,
    bits=13,
    get=code:@1:{12}:%x,
    unique
}

decoder {
    name=Nice-FLO,
    modulation=OOK_PWM,
    short=700,
    long=1400,
    gap=3000,
    reset=30000,
    tolerance=150,
    rows=1,
    match={1}8,
    bits=25,
    get=code:@1:{24}:%x,
    unique
}
