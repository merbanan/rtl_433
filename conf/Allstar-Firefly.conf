# Allstar Firefly fixed code gate remotes, e.g. 318ALD31K (Supertex ED-9 encoder)
#
# 318 MHz, 9 trinary DIP switches sent as 18 bits, 2 bits per switch: 11 = +, 10 = 0, 00 = -.
# PWM, a 1 bit is a 4000 us pulse and a 600 us gap, a 0 bit is a 600 us pulse and a 4000 us gap.
# Repeated after a 30 ms gap.
#
# The repeats are in one package, a gap longer than in a message starts a new row.
# There is no integrity check, so two identical repeats are required. The all "-" code (only
# short pulses) also matches other devices.
#
# Usage: rtl_433 -c conf/Allstar-Firefly.conf

decoder {
    name=Allstar-Firefly,
    modulation=OOK_PWM,
    short=600,
    long=4000,
    gap=10000,
    reset=40000,
    tolerance=800,
    invert,
    bits=18,
    repeats>=2,
    get=code:@0:{18}:%05x,
    unique
}
