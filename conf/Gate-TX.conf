# Gate TX gate remotes
#
# 433.92 MHz. A 17 ms gap, a 700 us start pulse, then 24 bits. Each bit is a gap and a pulse, a 1
# bit is a 700 us gap and a 350 us pulse, a 0 bit is a 350 us gap and a 700 us pulse. Sliced as PWM
# the start pulse is a leading 0 bit, a row has 25 bits.
#
# The 24 bit code is output as is. Reversed (LSB first) it is:
#
#     SSSSSSSS SSSSSSSS BBBB SSSS
#
# - S: 20 bit serial, the bytes 0 and 1 and the low nibble of byte 2, as serial bits 19..4 and 3..0
# - B: 4 bit button
#
# Flex can't reverse the bits, so only the raw code is output.
#
# There is no integrity check. The messages are 17 ms apart, each is a package of its own, so one
# row of 25 bits is required, containing a 1 bit followed by a 0 bit (match 10), which rejects the
# all zero and all one codes. The start bit is not checked, so 24 bit CAME remotes (start bit 1,
# 320/640 us) can match too.
#
# Protocol from the Flipper Zero firmware, lib/subghz/protocols/gate_tx.c.
#
# Usage: rtl_433 -c conf/Gate-TX.conf

decoder {
    name=GateTX,
    modulation=OOK_PWM,
    short=350,
    long=700,
    gap=1200,
    reset=10000,
    tolerance=150,
    rows=1,
    bits=25,
    match={2}8,
    get=code:@1:{24}:%06x,
    unique
}
