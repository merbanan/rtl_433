# Linear MultiCode and Delta-3 fixed code gate and garage remotes (DIP switch codes)
#
# The Linear MegaCode remotes are decoded by the built-in Megacode-Remote decoder.
#
# MultiCode, usually 300 MHz: 10 bit code, PWM, a 1 bit is a 1500 us pulse and a 500 us gap,
# a 0 bit is a 500 us pulse and a 1500 us gap. Repeated after a 21 ms gap.
#
# Delta-3, usually 318 MHz: 8 bit code, PWM, a 1 bit is a 500 us pulse and a 3500 us gap,
# a 0 bit is a 2000 us pulse and a 2000 us gap. Repeated after a 35 ms gap.
#
# MultiCode uses short=450 with tolerance 300: pulses from 150 to 750 us are short, so the shorter
# pulses of other remotes (e.g. about 230 us) count as bits instead of being skipped, and their
# messages are too long to match.
#
# Each message is a package of its own (the gap between repeats ends the package), so one row.
# A gap longer than in a message splits the row. There is no integrity check: the all zero
# MultiCode code and the all one Delta-3 code also match noise and some other remotes.
#
# Usage: rtl_433 -c conf/Linear-MultiCode.conf (add -f 300M or -f 318M)

decoder {
    name=Linear-MultiCode,
    modulation=OOK_PWM,
    short=450,
    long=1500,
    gap=2000,
    reset=5000,
    tolerance=300,
    invert,
    rows=1,
    bits=10,
    get=code:@0:{10}:%03x,
    unique
}

decoder {
    name=Linear-Delta3,
    modulation=OOK_PWM,
    short=500,
    long=2000,
    gap=4500,
    reset=10000,
    tolerance=200,
    rows=1,
    bits=8,
    get=code:@0:{8}:%02x,
    unique
}
