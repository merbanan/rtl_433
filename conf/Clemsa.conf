# Clemsa fixed code gate remotes and Clemsa MasterCode (MV1, MV12) remotes
#
# Clemsa: 18 bit code, PWM, a 1 bit is a 2695 us pulse and a 385 us gap, a 0 bit is a 385 us pulse
# and a 2695 us gap. Repeated after a 21 ms gap. The first 16 bits are 8 three position DIP switches
# (2 bits each: 11 is +, 10 is 0, 00 is -), the last 2 bits are the button.
#
# MasterCode: 36 bit code, PWM, a 1 bit is a 2145 us pulse and a 1072 us gap, a 0 bit is a 1072 us
# pulse and a 2145 us gap. Repeated after a 16 ms gap. Bits 16-31 (counted from the first bit sent)
# are the 8 DIP switches as above, bits 32-33 the button.
#
# The repeats are in one package, a gap longer than in a message starts a new row.
# There is no integrity check, so two identical repeats are required. All zero codes (only short
# pulses) also match noise and other devices.
#
# Usage: rtl_433 -c conf/Clemsa.conf

decoder {
    name=Clemsa,
    modulation=OOK_PWM,
    short=385,
    long=2695,
    gap=4000,
    reset=30000,
    tolerance=450,
    invert,
    bits=18,
    repeats>=2,
    get=id:@0:{16}:%04x,
    get=button:@16:{2},
    unique
}

decoder {
    name=Clemsa-MasterCode,
    modulation=OOK_PWM,
    short=1072,
    long=2145,
    gap=4000,
    reset=30000,
    tolerance=200,
    invert,
    bits=36,
    repeats>=2,
    get=id:@16:{16}:%04x,
    get=button:@32:{2},
    unique
}
