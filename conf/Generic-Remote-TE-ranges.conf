# Generic PT2262 / EV1527 remotes with a base timing outside the Generic-Remote range
#
# The base timing (TE) of these chips is set by the oscillator resistor and varies between remotes,
# from about 200 us to 700 us. The built-in Generic-Remote decoder (SC226x EV1527) only accepts
# TE 401-535 us. These decoders cover the other ranges:
#
# - TE 180-305 us
# - TE 275-416 us
# - TE 520-700 us
#
# A 0 bit is a TE pulse and a 3 TE gap, a 1 bit is a 3 TE pulse and a TE gap, followed by a TE
# stop pulse and a guard gap of about 31 TE: 25 bits per message.
# Each range is limited by the long pulse window: (long +/- tolerance) / 3. Neighbouring ranges
# overlap by about 15 us to allow for pulse jitter. They run at a lower priority, so a message is
# reported once, and only if Generic-Remote and the other default priority decoders did not match it.
#
# Output as for Generic-Remote: id is the first 16 bits, cmd the next 8 bits.
#
# Usage: rtl_433 -c conf/Generic-Remote-TE-ranges.conf

decoder {
    name=Generic-Remote-TE180,
    modulation=OOK_PWM,
    short=243,
    long=728,
    reset=1100,
    tolerance=187,
    priority=7,
    bits=25,
    invert,
    get=id:@0:{16},
    get=cmd:@16:{8},
    unique
}

decoder {
    name=Generic-Remote-TE275,
    modulation=OOK_PWM,
    short=346,
    long=1037,
    reset=1500,
    tolerance=212,
    priority=5,
    bits=25,
    invert,
    get=id:@0:{16},
    get=cmd:@16:{8},
    unique
}

decoder {
    name=Generic-Remote-TE520,
    modulation=OOK_PWM,
    short=610,
    long=1830,
    reset=2600,
    tolerance=271,
    priority=6,
    bits=25,
    invert,
    get=id:@0:{16},
    get=cmd:@16:{8},
    unique
}
