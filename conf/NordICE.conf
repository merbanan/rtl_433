# Nord ICE gate remotes
#
# 433.92 MHz, PWM: a 1 bit is an 800 us pulse and a 300 us gap, a 0 bit is a 300 us pulse and an
# 800 us gap. A message is 33 bits, repeated after a 7.5 ms gap, the repeats are in one package.
#
# Data layout (first bit sent first): 18 bit serial, high part; 6 bit button; 9 bit serial, low
# part. Flex can't join the serial parts: the 27 bit serial is serial_hi * 512 + serial_lo.
#
# There is no integrity check, so two identical repeats are required. The all zero and all one codes
# are not rejected: a match condition here would make flex output the first matching row instead of
# the repeated one.
#
# Feron LED remotes use nearly the same timing (350/750 us) and end with a 500 us pulse. Short
# pulses are taken up to 450 us (tolerance 150 us), so that end pulse is not read as a 33rd bit and
# Feron messages don't match. Silvercrest remotes (264/744 us, 33 bits) do match: flex can't exclude
# their header, they are decoded by the built-in Silvercrest-Remote decoder too.
#
# Protocol from the Flipper Zero firmware, lib/subghz/protocols/nord_ice.c.
#
# Usage: rtl_433 -c conf/NordICE.conf

decoder {
    name=NordICE,
    modulation=OOK_PWM,
    short=300,
    long=850,
    gap=2000,
    reset=12000,
    tolerance=150,
    invert,
    bits=33,
    repeats>=2,
    get=serial_hi:@0:{18}:%05x,
    get=button:@18:{6}:%02x,
    get=serial_lo:@24:{9}:%03x,
    unique
}
