# Treadmill remotes, 37 bit
#
# 433.92 MHz. PWM coded, a 1 bit is a 900 us pulse and a 300 us gap, a 0 bit is a 300 us pulse and a
# 900 us gap. A message is 37 bits, repeated after a 6 ms gap.
#
#     SSSSS BBBB X
#
# - S: 20 bit serial (id)
# - B: 16 bit button code
# - X: 1 bit
#
# There is no integrity check, at least two identical messages are required, and a row must
# contain a 1 bit followed by a 0 bit (match 10), which rejects the all zero codes of other
# sensors. Flex outputs the first row with the match, which can be a row of another length on
# other signals (see len).
#
# Protocol from the Flipper Zero firmware, lib/subghz/protocols/treadmill37.c.
#
# Usage: rtl_433 -c conf/Treadmill37.conf

decoder {
    name=Treadmill37,
    modulation=OOK_PWM,
    short=300,
    long=900,
    gap=2000,
    reset=10000,
    tolerance=250,
    invert,
    bits=37,
    repeats>=2,
    match={2}8,
    get=id:@0:{20}:%05x,
    get=button:@20:{16}:%04x,
    unique
}
