# Ansonic fixed code gate remotes, e.g. SF 433
#
# 433.92 MHz (some 434.075 MHz), 12 bit code, PWM, each bit is a gap followed by a pulse:
# a 1 bit is a 555 us gap and a 1111 us pulse, a 0 bit is a 1111 us gap and a 555 us pulse.
# A message starts with a 555 us start pulse after a 19 ms gap and is repeated.
# Bits 1-2 of the code (counted from the last bit) are the button, the others are DIP switches.
#
# Each message is a package of its own (the gap between messages ends the package), so one row:
# the start pulse (always 0) and the code. There is no integrity check: the all zero code
# (only short pulses) also matches other devices, e.g. Security+ 2.0.
#
# Usage: rtl_433 -c conf/Ansonic.conf

decoder {
    name=Ansonic,
    modulation=OOK_PWM,
    short=555,
    long=1111,
    gap=1400,
    reset=5000,
    tolerance=150,
    invert,
    rows=1,
    bits=13,
    match={1}0,
    get=code:@1:{12}:%03x,
    get=button:@10:{2},
    unique
}
