# CAME fixed code gate remotes, also Airforce and Prastel
#
# 433.92 MHz, PWM with a base time of 320 us: each bit is a gap followed by a pulse, a 1 bit is a
# 640 us gap and a 320 us pulse, a 0 bit is a 320 us gap and a 640 us pulse. A message starts with
# a 320 us start pulse (sliced as a 1 bit) after a 5 to 25 ms gap and is repeated.
#
# Lengths without the start pulse: CAME 12 and 24 bit, Airforce 18 bit, Prastel 25 and 42 bit.
# The code is output as sent (the DIP switches on 12 bit remotes). There is no integrity check.
#
# Each message is a package of its own, so one row. The row must contain a 1 bit followed by a 0
# bit (match 10): this rejects the all one code and rows of short pulses after a 0 bit, which other
# devices and noise give. The all zero code is not rejected. Flex can't check that the first bit
# (the start pulse) is 1, so Gate TX messages (24 bits after a 0 start bit) decode as 24 bit CAME.
# The 42 bit Prastel code doesn't fit one field, it is output as code_hi (18 bits) and code_lo
# (24 bits): code_hi followed by the 6 digits of code_lo is the code in hex.
# conf/CAME-TOP432.conf decodes the 12 bit remotes as well, with the same code.
#
# Usage: rtl_433 -c conf/CAME.conf

decoder {
    name=CAME-Remote,
    modulation=OOK_PWM,
    short=320,
    long=640,
    gap=2000,
    reset=30000,
    tolerance=150,
    rows=1,
    match={2}8,
    bits=13,
    get=code:@1:{12}:%03x,
    unique
}

decoder {
    name=CAME-Remote,
    modulation=OOK_PWM,
    short=320,
    long=640,
    gap=2000,
    reset=30000,
    tolerance=150,
    rows=1,
    match={2}8,
    bits=25,
    get=code:@1:{24}:%06x,
    unique
}

decoder {
    name=Airforce-Remote,
    modulation=OOK_PWM,
    short=320,
    long=640,
    gap=2000,
    reset=30000,
    tolerance=150,
    rows=1,
    match={2}8,
    bits=19,
    get=code:@1:{18}:%05x,
    unique
}

decoder {
    name=Prastel-Remote,
    modulation=OOK_PWM,
    short=320,
    long=640,
    gap=2000,
    reset=30000,
    tolerance=150,
    rows=1,
    match={2}8,
    bits=26,
    get=code:@1:{25}:%07x,
    unique
}

decoder {
    name=Prastel-Remote,
    modulation=OOK_PWM,
    short=320,
    long=640,
    gap=2000,
    reset=30000,
    tolerance=150,
    rows=1,
    match={2}8,
    bits=43,
    get=code_hi:@1:{18}:%05x,
    get=code_lo:@19:{24}:%06x,
    unique
}
