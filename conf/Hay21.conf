# Hay21 remotes
#
# 433.92 MHz. PWM coded, a 1 bit is a 700 us pulse and a 300 us gap, a 0 bit is a 300 us pulse and a
# 700 us gap. A message is 21 bits, repeated after a 4.2 ms gap.
#
#     BBBBBBBB SSSSSSSS CCCC 1
#
# - B: 8 bit button, e.g. 0x5a on/off, 0xc3 mode, 0x88 hold
# - S: 8 bit serial (id)
# - C: 4 bit counter, counts up on each press
# - 1: 1 bit, always 1
#
# There is no integrity check. The reset limit is below the 4.2 ms message gap, so each message is
# a package of its own: one row of exactly 21 bits is required, containing a 1 bit followed by a 0
# bit (match 10), which rejects the all zero and all one codes. Each message is output, there is no
# repeat check: with repeats>=2 flex accepts any repeated row of at least 21 bits, which matched
# many more signals of other devices. The end bit is not checked.
#
# Protocol from the Flipper Zero firmware, lib/subghz/protocols/hay21.c.
#
# Usage: rtl_433 -c conf/Hay21.conf

decoder {
    name=Hay21,
    modulation=OOK_PWM,
    short=300,
    long=700,
    gap=2000,
    reset=3000,
    tolerance=200,
    invert,
    rows=1,
    bits=21,
    match={2}8,
    get=button:@0:{8}:%02x,
    get=id:@8:{8}:%02x,
    get=counter:@16:{4},
    unique
}
