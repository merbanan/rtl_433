# FAAC SLH rolling code gate remotes, e.g. FAAC XT2/XT4 SLH
#
# 433.92 MHz and 868.35 MHz. Each message is a 1190 us pulse and a 1190 us gap, then 64 bits PWM
# coded: a 1 bit is a 595 us pulse and a 255 us gap, a 0 bit is a 255 us pulse and a 595 us gap.
# Messages are repeated back to back while the button is pressed.
#
#     FFFFFFFF HHHHHHHH
#
# - F: 32 bit fixed part, 28 bit serial (id) and 4 bit button
# - H: 32 bit encrypted part (KeeLoq with a key derived from a per remote seed)
#
# Flex values are 32 bit signed, so the encrypted part is output as encrypted_hi and encrypted_lo
# (16 bits each). The full 64 bits are in data.
#
# A master remote in programming mode sends the seed instead: the fixed part starts with 0x520f
# (id 520fxxx) and the low byte of the encrypted part is 0. Then the 32 bit word made of the low
# 16 bits of the fixed part and encrypted_hi is rotated right by the low nibble of byte 1 of the
# encrypted part, and each byte XOR byte 1 is the seed. Flex can't compute it, these messages are
# output like the others.
#
# There is no integrity check, at least two identical repeats are required.
#
# Protocol from the Flipper Zero firmware, lib/subghz/protocols/faac_slh.c.
#
# Usage: rtl_433 -c conf/FAAC-SLH.conf

decoder {
    name=FAAC-SLH,
    modulation=OOK_PWM,
    short=255,
    long=595,
    reset=3000,
    tolerance=100,
    invert,
    bits=64,
    repeats>=2,
    get=id:@0:{28}:%07x,
    get=button:@28:{4},
    get=encrypted_hi:@32:{16}:%04x,
    get=encrypted_lo:@48:{16}:%04x,
    unique
}
