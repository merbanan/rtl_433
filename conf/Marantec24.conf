# Marantec24 clone remotes
#
# Not a Marantec protocol: a fixed code remote sold as a Marantec replacement (a cloner), named
# Marantec24 by the Flipper Zero firmware. 433.92 MHz.
#
# PWM coded, each bit is 4000 us: a 1 bit is an 800 us pulse and a 3200 us gap, a 0 bit is a
# 1600 us pulse and a 2400 us gap. Each message is 24 bits, sent MSB first, and repeated after a
# 15200 us gap.
#
#     SSSSSSSSSSSSSSSSSSSS BBBB
#
# - S: 20 bit serial (id)
# - B: 4 bit button
#
# There is no integrity check, at least two identical repeats are required. The all zero and all
# one codes are not rejected (a match pattern would select a partial row of a real remote).
#
# Protocol from the Flipper Zero firmware, lib/subghz/protocols/marantec24.c.
#
# Usage: rtl_433 -c conf/Marantec24.conf

decoder {
    name=Marantec24-Clone,
    modulation=OOK_PWM,
    short=800,
    long=1600,
    gap=5000,
    reset=20000,
    tolerance=200,
    bits=24,
    repeats>=2,
    get=id:@0:{20}:%05x,
    get=button:@20:{4},
    unique
}
