# Elplast fixed code gate remotes, e.g. P-11B, 3BK, E.C.A
#
# 433.92 MHz, 18 bit code, PWM, a 1 bit is a 1550 us pulse and a 230 us gap, a 0 bit is a 230 us
# pulse and a 1550 us gap. Repeated after a 12 ms gap.
#
# The repeats are in one package, a gap longer than in a message starts a new row.
# There is no integrity check, so two identical repeats are required. The all zero code (only
# short pulses) also matches other devices.
#
# Usage: rtl_433 -c conf/Elplast.conf

decoder {
    name=Elplast,
    modulation=OOK_PWM,
    short=230,
    long=1550,
    gap=2500,
    reset=30000,
    tolerance=300,
    invert,
    bits=18,
    repeats>=2,
    get=code:@0:{18}:%05x,
    unique
}
