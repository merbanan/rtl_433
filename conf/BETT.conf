# BETT fixed code gate remotes (Berner, Elka, Tedsen, Teletaster)
#
# 433.92 MHz, 18 bit code, PWM, a 1 bit is a 2000 us pulse and a 340 us gap, a 0 bit is a 340 us
# pulse and a 2000 us gap. Repeated after a 16 ms gap. The code is 9 three position DIP switches
# (2 bits each: 11 is +, 10 is 0, 00 is -).
#
# The repeats are in one package, a gap longer than in a message starts a new row.
# There is no integrity check, so two identical repeats are required. The all zero code (only
# short pulses) also matches other devices.
#
# Usage: rtl_433 -c conf/BETT.conf

decoder {
    name=BETT,
    modulation=OOK_PWM,
    short=340,
    long=2000,
    gap=3000,
    reset=30000,
    tolerance=300,
    invert,
    bits=18,
    repeats>=2,
    get=code:@0:{18}:%05x,
    unique
}
