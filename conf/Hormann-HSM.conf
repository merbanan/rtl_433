# Hormann HSM fixed code garage door remotes, 44 bit
#
# The 868 MHz remotes with 32 bit codes (blue button) are decoded by conf/Hormann-blue.conf.
#
# Seen on 433.92 MHz and 868 MHz. PWM coded, a 1 bit is a 1000 us pulse and a 500 us gap, a 0 bit
# is a 500 us pulse and a 1000 us gap. A message starts with a 12 ms start pulse and a 500 us gap,
# about 20 messages are sent back to back.
#
#     FFFFFFFF CCCCCCCCCCCCCCCCCCCCCCCC BBBB XXXXXX11
#
# - F: 8 bit sync, always 0xff
# - C: 24 bit code
# - B: 4 bit button
# - X: 8 bit, the last 2 bits are always 1
#
# There is no integrity check, at least two identical messages are required, and a row must contain
# the 0xff sync (match). The last 2 bits are not checked. The full 44 bits are in data.
#
# Protocol from the Flipper Zero firmware, lib/subghz/protocols/hormann.c.
#
# Usage: rtl_433 -c conf/Hormann-HSM.conf

decoder {
    name=Hormann-HSM,
    modulation=OOK_PWM,
    short=500,
    long=1000,
    gap=3000,
    reset=30000,
    tolerance=250,
    invert,
    bits=44,
    repeats>=2,
    match={8}ff,
    get=code:@8:{24}:%06x,
    get=button:@32:{4}:%x,
    unique
}
