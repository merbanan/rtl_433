# Decoder for the Vion C6500 weather station wind sensor (anemometer + wind vane)
#
# See https://github.com/merbanan/rtl_433/issues/3736
#
# Transmits on ~434.21 MHz (not 433.92 MHz): with the default 250k sample rate
# at 433.92M the signal is out of band, use e.g. `-f 433.92M -s 1024k` or `-f 434.2M`.
# The signal is very strong close to the sensor: with automatic gain the R820T
# saturates and the gaps between pulses are lost; a fixed gain (e.g. `-g 43.4`) works.
#
# OOK PWM: short 142 us, long 278 us, sync 414 us, each pulse followed by a gap of
# the same width. 82 bits every ~14.4 s, sent twice; the last bit of byte 9
# (raw bit 79) toggles between the two repeats.
#
# Bytes are sent LSB first, `reflect` turns them into normal byte values:
#
#     ID:16h AVG:8d GUST:8d WIND:8d AVG_DIR:8d GUST_DIR:8d DIR:8d FLAGS:8b ?:8h ?:2b
#
# - ID       : constant 0x951c (raw 0xa938) on this unit, may be a per-unit id
# - WIND     : wind speed in 0.5 km/h
# - GUST     : gust speed (max over a sliding window) in 0.5 km/h
# - AVG      : average wind speed in 0.5 km/h
# - DIR      : wind direction in degrees, low 8 bits
# - GUST_DIR : gust direction in degrees, low 8 bits
# - AVG_DIR  : average wind direction in degrees, low 8 bits
# - FLAGS    : (after reflect, bit 0 = MSB) bit 1 = DIR + 256, bit 2 = GUST_DIR + 256,
#              bit 3 = AVG_DIR + 256
# - remaining bits of byte 8 and byte 9: unknown (checksum? battery?)
#
# Validated against the console display in all three display modes
# (instant, gust, average), including directions above 255 degrees.
#
#     wind speed (km/h) = wind_raw / 2     direction (deg) = dir_lo + 256 * dir_hi
#     gust speed (km/h) = gust_raw / 2     direction (deg) = gust_dir_lo + 256 * gust_dir_hi
#     avg speed (km/h)  = avg_raw / 2      direction (deg) = avg_dir_lo + 256 * avg_dir_hi

decoder {
    n=Vion-C6500,
    m=OOK_PWM,
    s=142,
    l=278,
    r=1000,
    g=600,
    t=60,
    y=414,
    bits=82,
    match={16}951c,
    reflect,
    get=avg_raw:@16:{8},
    get=gust_raw:@24:{8},
    get=wind_raw:@32:{8},
    get=avg_dir_lo:@40:{8},
    get=gust_dir_lo:@48:{8},
    get=dir_lo:@56:{8},
    get=dir_hi:@65:{1},
    get=gust_dir_hi:@66:{1},
    get=avg_dir_hi:@67:{1},
}
