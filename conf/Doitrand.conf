# Doitrand gate remotes with 10 DIP switches
#
# 433.92 MHz, PWM: each bit is a gap and a pulse, a 1 bit is a 1100 us gap and a 400 us pulse, a 0
# bit is a 400 us gap and a 1100 us pulse. A message is a 24.8 ms gap, a 700 us start pulse (sliced
# as a sync), then 37 bits, and is repeated.
#
# Flex values are 32 bit, so the 37 bit code is output as code_hi (13 bits) and code_lo (24 bits):
# code_hi followed by the 6 digits of code_lo is the code in hex. Bits counted from the first bit
# sent (bit 0), the DIP switches as the Flipper Zero shows them:
#
# - DIP 1: bit 12 or bit 21, DIP 2 to 5: bits 4 to 7, DIP 6 to 9: bits 0 to 3, DIP 10: bit 11
# - button: bits 17 and 18
# - the other bits are not known
#
# There is no integrity check. Each message is a package of its own, so one row, and the row must
# contain a 1 bit followed by a 0 bit (match 10), which rejects the all zero and all one codes.
# Flex can't require the start pulse before the row, so 37 bit rows of some other devices match
# (e.g. an Oil Watchman sensor in rtl_433_tests).
#
# Protocol from the Flipper Zero firmware, lib/subghz/protocols/doitrand.c.
#
# Usage: rtl_433 -c conf/Doitrand.conf

decoder {
    name=Doitrand,
    modulation=OOK_PWM,
    short=400,
    long=1100,
    sync=750,
    gap=2000,
    reset=10000,
    rows=1,
    match={2}8,
    bits=37,
    get=code_hi:@0:{13}:%04x,
    get=code_lo:@13:{24}:%06x,
    get=button:@17:{2},
    unique
}
