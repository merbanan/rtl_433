# Roger Technology fixed code gate remotes
#
# 433.92 MHz, PWM coded with a base time of 500 us: a 1 bit is a 1000 us pulse and a 500 us gap,
# a 0 bit is a 500 us pulse and a 1000 us gap. Each message is 28 bits, sent MSB first, followed by
# a 9.5 ms gap, and repeated. There is no integrity check.
#
# Data layout:
#
#     SSSSSSSSSSSSSSSS BBBB EEEEEEEE
#
# - S: 16 bit serial
# - B: 4 bit button, one bit per button (1, 2, 4, 8)
# - E: 8 bit end code, usually the button again, 0x20 or 0x23 seen on some remotes
#
# short=450 with tolerance 300: pulses from 150 to 750 us are short, so the shorter pulses of
# other devices (e.g. 200 us) count as bits instead of being skipped, and their messages don't match.
#
# Each message is a package of its own (the gap between messages ends the package), so one row
# containing a 1. Other button values (noise) and all one codes are not rejected.
#
# Usage: rtl_433 -c conf/Roger.conf

decoder {
    name=Roger-Remote,
    modulation=OOK_PWM,
    short=450,
    long=1000,
    reset=6000,
    tolerance=300,
    rows=1,
    bits=28,
    match={1}8,
    invert,
    get=id:@0:{16}:%x,
    get=button:@16:{4},
    get=code:@20:{8}:%x,
    unique
}
