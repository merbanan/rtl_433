# Key finder tags
#
# 433.92 MHz, 24 bit code, PWM, a 1 bit is a 400 us pulse and a 1200 us gap, a 0 bit is a
# 1200 us pulse and a 400 us gap. The code is followed by 4 short pulses (1 bits) and a 4 ms gap.
#
#     SSSSSSSSSSSSSSSSSSSS BBBB 1111
#
# - S: 20 bit serial
# - B: 4 bit button
#
# There is no integrity check, so two identical repeats are required.
#
# long=1300 with tolerance 250: long pulses are taken from 1050 to 1550 us, so the 1000 us pulses
# of other 28 bit remotes (e.g. Roger) are not taken as long pulses. The all one code (only short
# pulses) also matches other devices.
#
# Protocol from the Flipper Zero firmware, lib/subghz/protocols/keyfinder.c.
#
# Usage: rtl_433 -c conf/KeyFinder.conf

decoder {
    name=KeyFinder,
    modulation=OOK_PWM,
    short=400,
    long=1300,
    gap=2500,
    reset=10000,
    tolerance=250,
    bits=28,
    repeats>=2,
    get=id:@0:{20}:%05x,
    get=button:@20:{4},
    unique
}
