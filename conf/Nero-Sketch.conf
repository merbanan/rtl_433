# Nero Sketch blind and shutter remotes
#
# 433.92 MHz. A message is 47 x (330 us pulse, 330 us gap), a 1320 us start pulse, then 40 bits and
# a 990 us stop pulse. PWM coded, a 1 bit is a 660 us pulse and a 330 us gap, a 0 bit is a 330 us
# pulse and a 660 us gap. The message is repeated back to back.
#
# The layout of the 40 bit code is not known. Flex values are 32 bit, so the code is output as
# code_hi (16 bits) and code_lo (24 bits): code_hi followed by the 6 digits of code_lo is the code
# in hex.
#
# There is no integrity check. Without a tolerance the start and stop pulses slice as 1 bits, so a
# transmission is one row. The preamble is the stop pulse of a message, the 47 preamble pulses and
# the start pulse of the next message, so at least two messages are needed (the first message is
# not decoded); they are not compared. The preamble tells it from Dooya remotes (single 4.8 ms
# start pulse, 40 bits) and Nero Radio remotes (200/400 us).
#
# Protocol from the Flipper Zero firmware, lib/subghz/protocols/nero_sketch.c.
#
# Usage: rtl_433 -c conf/Nero-Sketch.conf

decoder {
    name=Nero-Sketch,
    modulation=OOK_PWM,
    short=330,
    long=660,
    gap=1500,
    reset=10000,
    invert,
    bits>=130,
    preamble={49}8000000000008,
    get=code_hi:@0:{16}:%04x,
    get=code_lo:@16:{24}:%06x,
    unique
}
