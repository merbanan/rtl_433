# Vornado Strata fan remote, FCC ID WOT-STRATA (IC: 21371-STRATA)
#
# 433.92 MHz OOK PWM, CR2032 remote with 4 buttons. Fixed code, no rolling code.
# The remote must be paired with the fan, so the ID is per remote.
#
# Timing: short 500 us, long 1500 us, bit period 2 ms.
# Frame: 29 data bits, then a sync of a 500 us pulse and an 8 ms gap.
# Each press sends 5 frames, about 0.39 s in total (matches the FCC test report).
#
# Bits, with a short pulse decoded as 1:
#   IIIIIIII IIIIIIII IIII BBBB TTTTT S
#   I: 20-bit ID (assumed, from one remote only)
#   B: button (5 power, 4 oscillate, 3 speed up, 2 speed down)
#   T: fixed tail 00101
#   S: the sync pulse, always 1
# Example rows: fd95a52c (power), fd95a42c (oscillate), fd95a32c (up), fd95a22c (down).

frequency 433.92M

decoder {
    name        = Vornado-Strata,
    modulation  = OOK_PWM,
    short       = 500,
    long        = 1500,
    gap         = 1600,
    reset       = 10000,
    tolerance   = 300,
    bits        = 30,
    repeats    >= 3,
    unique,
    get         = id:@0:{20}:%05x,
    get         = button:@20:{4}:[5:power 4:oscillate 3:speed_up 2:speed_down],
    get         = tail:@24:{6}:%02x,
}
