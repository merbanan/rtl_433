# Nero Radio blind and shutter remotes
#
# 433.92 MHz. A message is 49 x (200 us pulse, 200 us gap), an 830 us start pulse, then 56 bits and
# a 4.6 ms gap. PWM coded, a 1 bit is a 400 us pulse and a 200 us gap, a 0 bit is a 200 us pulse and
# a 400 us gap. The message is repeated. Some remotes send 57 bits with a 1.3 ms gap (second
# decoder, one more leading bit, no sample).
#
#     IIIIIII B SSSS CC
#
# - I: 28 bit serial, high part (id_hi)
# - B: 4 bit button
# - S: 16 bit serial, low part (id_lo)
# - C: 8 bit, unknown, changes with the button (maybe a checksum)
#
# The serial is id_hi followed by the 4 digits of id_lo.
#
# There is no known integrity check, at least two identical messages are required. Without a
# tolerance the start pulse slices as a 1 bit, so a row is the 49 preamble bits, the start pulse
# and the message, and the preamble tells it from Acurite 592TXR sensors (4 sync pulses, same
# timing, 56 bits).
#
# Protocol from the Flipper Zero firmware, lib/subghz/protocols/nero_radio.c.
#
# Usage: rtl_433 -c conf/Nero-Radio.conf

decoder {
    name=Nero-Radio,
    modulation=OOK_PWM,
    short=200,
    long=400,
    gap=1000,
    reset=10000,
    invert,
    bits=106,
    repeats>=2,
    preamble={50}0000000000004,
    get=id_hi:@0:{28}:%07x,
    get=button:@28:{4},
    get=id_lo:@32:{16}:%04x,
    get=check:@48:{8}:%02x,
    unique
}

decoder {
    name=Nero-Radio,
    modulation=OOK_PWM,
    short=200,
    long=400,
    gap=1000,
    reset=10000,
    invert,
    bits=107,
    repeats>=2,
    preamble={50}0000000000004,
    get=id_hi:@0:{29}:%08x,
    get=button:@29:{4},
    get=id_lo:@33:{16}:%04x,
    get=check:@49:{8}:%02x,
    unique
}
