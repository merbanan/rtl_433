# Revers RB2 / RB2M gate remotes
#
# 433.92 MHz, Manchester coded with a half-bit time of 250 us. The 64 bit message is sent over
# and over without a gap: 32 one bits, then a 22 bit id and the 10 bit stop code 0x200.
# The Flipper Zero shows the id with the 10 bits above it set (0xffc00000 added).
#
# The preamble is the stop code of the previous message and the 32 one bits, so at least two
# messages are needed. There is no other integrity check.
#
# Usage: rtl_433 -c conf/Revers-RB2.conf

decoder {
    name=Revers-RB2,
    modulation=OOK_MC_ZEROBIT,
    short=250,
    long=250,
    reset=1000,
    invert,
    preamble={42}803fffffffc0,
    bits>=96,
    get=id:@0:{22}:%06x,
    unique
}
